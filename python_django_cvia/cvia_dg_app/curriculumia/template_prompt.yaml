    {delimitador}
    {delimitador_titular}
    El nombre del candidato o usuario corresponde a {nombre_candidato}
    {delimitador_titular}
    {delimitador_idioma}
    El idioma para la respuesta de entrega al usuario que hizo la solicitud es {idioma_respuesta}
