  entrada: >
    {delimitador}
    La información se debe de extraer del siguiente documento {query}.
    {delimitador}
    {delimitador_titular}
    El nombre del candidato postulante a un puesto laboral corresponde a {nombre_candidato}
    {delimitador_titular}
    {delimitador_categoria}
    El nombre de la categoria del curriculum vitae corresponde a {nombre_categoria}
