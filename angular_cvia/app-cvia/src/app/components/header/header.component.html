<nav class="header">
  <!-- Menu Sin Login -->
  <ul class="left-menu">
    @if (!isLoggedIn){
    <li><a href="/">Startup</a></li>
    }
  </ul>
  <ul class="right-menu"> 
    @if (!isLoggedIn){
      <li class="nav-item">
          <a href="#" (click)="showLogin()" 
            class="btn btn-success rounded-pill px-4 shadow-sm" 
            style="background-color: #4CAF50; border-color: #4CAF50; font-size: 18px;">
            Login
          </a>
        </li>
        <li class="nav-item">
          <a href="#" (click)="crearNuevoUsuario()" 
            class="btn btn-outline-success rounded-pill px-4" 
            style="background-color: #d1e7dd; color: #0f5132; border-color: #badbcc; font-size: 18px;">
            Registro
          </a>
        </li>
    }
  </ul>
</nav>

<nav class="header">
  <!-- Menu Con Login -->
  <ul class="left-menu">
    @if (isLoggedIn){
    <li><a href="/">Startup</a></li>
    }
  </ul>
  <ul class="right-menu">
    @if (isLoggedIn){
    <li class="dropdown">
      <a href="#">Usuario</a>
      <ul class="dropdown-menu">
        <li><a href="#" (click)="showPerfil()">Perfil</a></li>
        <li><a href="#" (click)="showCambiarPassword()">Cambiar contraseña</a></li>
        <li><a href="#" (click)="showDarBaja()">Dar de baja usuario</a></li>
        <li><a (click)="logout()">Salir</a></li>
      </ul>
    </li>
  }
  </ul>
</nav>
