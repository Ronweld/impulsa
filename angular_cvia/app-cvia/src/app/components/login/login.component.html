@if (mostrarFormulario) {
<div class="overlay"></div>
}

<div class="login-form">
  <h2>Login</h2>

  <div class="form-single">
    <input class="username" type="text" id="username" name="username" [value]="username" (input)="onUsernameChange($event)" placeholder="Usuario" required />
  </div>

  <div class="form-single password-container">
    <input class="password"  [type]="mostrarPassword ? 'text' : 'password'" id="password" name="password" [value]="password" (input)="onPasswordChange($event)" placeholder="Contraseña" required/>
      <span class="toggle-password" (click)="togglePasswordVisibility()">
        {{ mostrarPassword ? '🔒' : '👁️' }}
      </span>
  </div>

  <div class="form-group-captcha-container">
    <img [src]="captchaImageUrl" alt="CAPTCHA" >
    <button class="refresh-button" (click)="generateCaptcha()" title="Generar CAPTCHA">
      &#x21BB;
    </button>
    <input class="input-captchaInput" id="captcha" type="text" [formControl]="captchaInput" maxlength="6" placeholder="Ej: ABC123" (keyup.enter)="validateCaptcha()" />
  </div>
    
  <div class="button-container">
    <button class="login" (click)="login()">Iniciar sesión</button>
    <button class="close-login" (click)="closeLogin()">Cancelar</button>
  </div>

  <div  class="message" [class.success]="validationSuccess" [class.error]="validationSuccess === false">
    @if (validationMessage){ 
      {{ validationMessage }}
      }
  </div>
  
  <div class="additional-links">
    <a href="#" (click)="olvidoPassword()">¿Olvidó su contraseña?</a>
    <a href="#" (click)="crearNuevoUsuario()">Crear nuevo usuario</a>
  </div>

  <div class="errores" *ngIf="errores.length > 0">
    <p>⚠️ Errores encontrados:</p>
    <ul>
      <li *ngFor="let error of errores">{{ error }}</li>
    </ul>
  </div>

</div>
