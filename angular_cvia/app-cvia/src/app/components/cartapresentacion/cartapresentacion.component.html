<ng-container *ngIf="mostrarFormulario">
  <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50" 
       style="z-index: 1040;" 
       (click)="closeCartaPresentacion()">
  </div>

  <div class="position-fixed top-50 start-50 translate-middle w-100 p-3" 
       style="z-index: 1050; max-width: 50%;">
    
    <div class="card shadow-lg">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
        <h2 class="h5 mb-0">Carta de presentación</h2>
        <button type="button" class="btn-close btn-close-white" (click)="closeCartaPresentacion()"></button>
      </div>

      <div class="card-body" style="min-height: 65%; display: flex; flex-direction: column;">
        
        <div class="mb-3">
          <label for="tipo_Presentacion" class="form-label fw-bold small text-muted">Tipo de presentación</label>
          <select id="tipo_Presentacion" class="form-select form-select-lg" [(ngModel)]="seleccionCodigo" (change)="errores = []">
            <option value="" disabled selected>Seleccione una opción...</option>
            <option *ngFor="let opt of opciones" [value]="opt.codigo">{{ opt.valor }}</option>
          </select>
        </div>

        <ng-container *ngIf="seleccionCodigo === 'PRIMER_EMPLEO' || seleccionCodigo === 'SIN_OFERTA'">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="nombreEmpresa" class="form-label fw-bold small text-muted">Nombre de la empresa <span class="text-danger">*</span></label>
              <input type="text" id="nombreEmpresa" class="form-control" [(ngModel)]="nombre_empresa" (input)="errores = []">
            </div>
            <div class="col-md-6 mb-3">
              <label for="nombrePersona" class="form-label fw-bold small text-muted">Nombre de la persona (Opcional)</label>
              <input type="text" id="nombrePersona" class="form-control" [(ngModel)]="nombre_persona">
            </div>
          </div>
        </ng-container>

        <div class="mb-3 flex-grow-1" *ngIf="seleccionCodigo === 'CON_OFERTA'">
          <label class="form-label fw-bold small text-muted">Convocatoria <span class="text-danger">*</span></label>
          <textarea [(ngModel)]="convocatoriaInput" class="form-control" rows="10" placeholder="Pega aquí el texto..." (input)="errores = []"></textarea>
        </div>

        <div class="mt-auto">
          <div class="mb-2" *ngIf="seleccionCodigo">
            <small class="text-muted fst-italic"><span class="text-danger">*</span> Campos obligatorios</small>
          </div>
          
          <div *ngIf="errores.length > 0" class="alert alert-danger py-2 mb-2 animate__animated animate__fadeIn">
            <ul class="mb-0 small">
              <li *ngFor="let error of errores">{{ error }}</li>
            </ul>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-3">
          <button class="btn btn-primary btn-lg px-4" (click)="generateCartaPresentacion()">
            Generar carta
          </button>
          <button class="btn btn-secondary btn-lg px-4" (click)="closeCartaPresentacion()">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
