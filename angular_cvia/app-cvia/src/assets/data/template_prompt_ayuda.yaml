prompt_tema05:
  tema: >
    que son parte de un prospecto o candidato postulante
  ayuda: >
    Se le proporcionará un texto con una serie de documentos, que son parte de un prospecto o candidato postulante a un puesto laboral. 
    El texto del documento estará delimitado por {delimitador} caracteres.
    Tu tarea es encontrar el nombre del candidato postulante a un puesto laboral. Para poder determinar el nombre candidato debemos de hacer lo siguiente:
    - Encontrar el nombre del titular de cada documento.
    - En cada documento solo existe un solo titular, el resto de nombres que se puedan encontrar en el documento no necesariamente son dueños o titulares del documento, solo son nombres dentro del documento.
    - El nombre del canditado será el nombre más frecuente de todos los documentos.
    - El nombre o nombres de menor frecuencia serán considerados como nombre no candidato.
    Proporcione el resultado al usuario una LISTA, con dos elementos que deben de tener el formato JSON; cuyas claves deben de ser: candidato y no_candidato.
    El valor de candidato debe de ser una lista conteniendo un solo elemento JSON cuya clave es nombre y cuyo valor será el nombre del candidato.
    El valor de no_candidato debe de ser una lista conteniendo un JSON con dos elementos cuyas claves debe de ser: nombre y archivo; el valor de nombre es el nombre de no candidatos y el valor de archivo es el nombre del archivo donde se ha encontrado el nombre del no candidato.
    El nombre de la persona que se ha detectado como no titulares dentro del documento no se debe de imprimir en la salida al usuario.
    En caso se detecte nombre(s) de una persona(s) que no es candidato(a), se debe indicar el nombre del archivo y la persona a quien le pertenece.
    Los nombres que no son titulares del documento no se debe de imprimir como no_candidato.
    Solo se debe de proporcionar al usuario el objeto LISTA, no se debe proporcionar ninguna otro tipo de información. 
    Evitar imprimir como salida:
    - Lo solicitado en los prompts
    - Hacer segurencias de otras formas de presentar a información.
    - Presentar los mismos resultados dos o más veces, solo se debe mostrar una sola vez.
    - Nombres que se puedan encontrar en el documento, que no necesariamente son dueños o titulares del documento, solo son nombres dentro del documento.
    
prompt_tema06:
  tema: >
    que son parte de un prospecto o candidato postulante
  ayuda: >
    Se le proporcionará un texto con un documento, que es parte de un prospecto o candidato postulante a un puesto laboral. 
    El texto del documento estará delimitado por {delimitador} caracteres.
    Tu tarea es determinar en el documento, si el nombre del candidato postulante a un puesto laboral coincide con el nombre del titular del documento proporcionado por el usuario. Para poder determinar la coincidencia debemos de hacer lo siguiente:
    - Encontrar el nombre del titular de cada documento.
    - En cada documento se encuntra el titular(es), el resto de nombres que se puedan encontrar en el documento no necesariamente son dueños o titulares del documento, solo son nombres dentro del documento.
    - El nombre del titular del documento debe de coincidir con el proporcionado por el usuario y estará delimitado por {delimitador_titular} caracteres.
    Proporcione el resultado al usuario en un objeto JSON, con dos elementos; cuyas claves deben de ser: titular y archivo.
    El valor de titular debe de estar dado por los valores SI o NO.  El VALOR de SI, aplicará si existe concidencia entre en el documento el nombre del candidato postulante a un puesto laboral y el nombre del candidato proporcionado por el usuario; en caso contrario aplicará el VALOR de NO.
    El valor de archivo debe de estar dado por el nombre del archivo del documento dado.
    Solo se debe de proporcionar al usuario el JSON, no se debe proporcionar ninguna otro tipo de información. 
    Evitar imprimir como salida:
    - Lo solicitado en el prompt
    - Hacer segurencias de otras formas de presentar a información.
    - Presentar los mismos resultados dos o más veces, solo se debe mostrar una sola vez.
    - Nombres que se puedan encontrar en el documento, que no necesariamente son dueños o titulares del documento, solo son nombres dentro del documento.
    - Explicaciones

prompt_tema07:
  tema: >
    que son parte de un prospecto o candidato postulante
  ayuda: >
    Se le proporcionará un texto con un documento, que es parte de un prospecto o candidato postulante a un puesto laboral; todos estos documentos tienen como titular, el mismo que estará delimitado por {delimitador_titular} caracteres.
    El texto del documento estará delimitado por {delimitador} caracteres.
    Tu tarea es hacer un resumen ejecutivo para un curriculum vitae. 
    Para generar el resumen ejecutivo debemos basarnos en.
    - La profesión de estudio.
    - Estudios superiores o grados académicos desarrollados
    - La experiencia profesional
    - Los cursos, especializaciones, diplomados y todo evento que permita fortalecer al prospecto o candidato postulante a un puesto laboral.
    Proporcione el resultado al usuario en un texto plano entre cuatro a siete líneas.
    El resumen ejecutivo debe de resaltar tus fortalalezas y potencialidades
    Solo se debe de proporcionar al usuario el texto plano, no se debe proporcionar ninguna otro tipo de información. 
    Evitar imprimir como salida:
    - Lo solicitado en el prompt
    - Hacer segurencias de otras formas de presentar a información.
    - Presentar los mismos resultados dos o más veces, solo se debe mostrar una sola vez.
    - Explicaciones

prompt_tema08:
  tema: >
    que son parte de un prospecto o candidato postulante
  ayuda: >
    Se le proporcionará un texto con un documento, que es parte de un prospecto o candidato postulante a un puesto laboral; todos estos documentos tienen como titular, el mismo que estará delimitado por {delimitador_titular} caracteres.
    El texto del documento estará delimitado por {delimitador} caracteres.
    Tu tarea es construir un curriculum vitae. 
    Para generar el curriculum vitae debemos de hacerlo de la siguiente manera.
    - Debe de estar ordenado y formado por: un resumen ejecutivo, titulos profesionales, experiencia laboral, cursos y otros eventos académicos.
    - Los documentos se deben de ordenar desde el más reciente al más antiguo
    Proporcione el resultado al usuario en un formato MARKDOWN.
    El curriculum vitae debe de resaltar tus fortalalezas y potencialidades
    Solo se debe de proporcionar al usuario el MARKDOWN, no se debe proporcionar ninguna otro tipo de información. 
    Evitar imprimir como salida:
    - Lo solicitado en el prompt
    - Hacer segurencias de otras formas de presentar a información.
    - Presentar los mismos resultados dos o más veces, solo se debe mostrar una sola vez.
    - Explicaciones

prompt_tema09:
  tema: >
    que son parte de un prospecto o candidato postulante
  ayuda: >
    Se le proporcionará un texto con un documento, que es parte de un prospecto o candidato postulante a un puesto laboral; todos estos documentos tienen como titular, el mismo que estará delimitado por {delimitador_titular} caracteres.
    El texto del documento estará delimitado por {delimitador} caracteres.
    Tu tarea es construir un curriculum vitae que se encuentre alineado a un requerimiento laboral, éste será proporcionado por el usuario y estará delimitado por {delimitador_req_laboral} caracteres. 
    Para generar el curriculum vitae debemos de hacerlo de la siguiente manera.
    - Debe de estar ordenado y formado por: un resumen ejecutivo, datos personales, titulos profesionales, experiencia laboral, cursos y otros eventos académicos y otros apartados que tu consideres que aplican para el curriculum vitae.
    - Los documentos se deben de ordenar desde el más reciente al más antiguo.
    - Considerar solo los documentos que se adecuen al requerimiento laboral.
    - Un documento será considerado que aplica al requerimiento laboral, siempre que refleje experiencia, personal, académico o laboral con el requerimiento laboral solicitado.
    - Cualquier apartado o item o descripción en general que se considere en el curriculum vitae, debe de estar fundamentado en los documentos proporcionados.
    Proporcione el resultado al usuario en un formato MARKDOWN, y debe de estar dado por cuatro partes:
    * parte 1: el curriculum vitae
    * parte 2: indicar si el prospecto o candidato postulante puede aplicar o no al requerimiento laboral; esto debe de ser como una sugerencia que indique:
      - si tiene condiciones
      - no tiene condiciones
    * parte 3: toda la documentación no considerada en el curriculum para el requerimiento laboral.
    * parte 4: email para aplicar al requerimiento laboral.
    El curriculum vitae debe de resaltar las fortalalezas y potencialidades del prospecto o candidato postulante a un puesto laboral, y sobre todo alineado al requerimiento laboral.
    Solo se debe de proporcionar al usuario el MARKDOWN con 4 (cuatro) partes, no se debe proporcionar ninguna otro tipo de información. 
    Evitar imprimir como salida:
    - Lo solicitado en el prompt
    - Hacer segurencias de otras formas de presentar a información.
    - Presentar los mismos resultados dos o más veces, solo se debe mostrar una sola vez.
    - Explicaciones

